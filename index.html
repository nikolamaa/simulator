<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#16151d">
<meta name="color-scheme" content="dark">
<title>Longplay</title>
<meta name="description" content="Play your own handheld game files in the browser, in release order, with progress saved automatically.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preload" href="fonts/bai-jamjuree-latin-700-italic.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <nav class="rail" aria-label="Main">
    <a class="brand" href="#/library" aria-label="Longplay, library">
      <svg class="brand__mark" viewBox="0 0 32 32" aria-hidden="true"><path d="M5 3h17l5 5v19a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2z" fill="currentColor"/><rect x="9" y="9" width="14" height="11" rx="1.5" fill="#b9c76a"/><path d="M14 11.8v5.4l4.6-2.7z" fill="#2d3713"/><path d="M10 24h3M15 24h3" stroke="#16151d" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="brand__name">Longplay</span>
    </a>
    <button class="rail__continue" id="continue" type="button" hidden></button>
    <ul class="rail__nav">
      <li><a href="#/library" data-nav="library"><span data-icon="shelf"></span><span>Library</span></a></li>
      <li><a href="#/playthrough" data-nav="playthrough"><span data-icon="route"></span><span>Playthrough</span></a></li>
      <li><a href="#/settings" data-nav="settings"><span data-icon="gear"></span><span>Settings</span></a></li>
    </ul>
    <p class="rail__foot" id="rail-foot"></p>
  </nav>
  <main class="main" id="main">
    <section class="view" id="view-library" aria-label="Library"></section>
    <section class="view" id="view-playthrough" aria-label="Playthrough" hidden></section>
    <section class="view" id="view-settings" aria-label="Settings" hidden></section>
  </main>
</div>
<section class="player" id="view-player" aria-label="Player" hidden></section>
<div class="dropveil" id="dropveil" hidden><p>Drop game files to add them</p></div>
<div class="toasts" id="toasts" aria-live="polite"></div>
<noscript><p style="padding:24px;font:16px system-ui;color:#ece9e1;background:#16151d">Longplay needs JavaScript to run the emulator.</p></noscript>
<script type="module" src="js/app.js"></script>
</body>
</html>
