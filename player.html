<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Game screen</title>
<style>
  html, body { margin: 0; width: 100%; height: 100%; background: #000; overflow: hidden;
    touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; }
  #game { position: absolute; inset: 0; background: #000; outline: none; }
  /* Longplay draws every control itself, so the emulator's own menus and prompts stay hidden. */
  #game > :not(.ejs_game):not(.ejs_canvas_parent) { display: none !important; }
  #game canvas { display: block; width: 100%; height: 100%; image-rendering: pixelated !important; }
  html.smooth #game canvas { image-rendering: auto !important; }
</style>
</head>
<body>
<div id="game"></div>
<script src="js/player-frame.js"></script>
</body>
</html>
